<div class="relative group border border-dark-300 rounded-lg overflow-hidden hover:border-gold transition">
    <img src="{{ image.image.url }}" alt="{{ image.caption|default:'Gallery image' }}" class="w-full h-48 object-cover">
    {% if image.caption %}
    <div class="p-2 bg-dark-100">
        <p class="text-sm text-text-secondary truncate">{{ image.caption }}</p>
    </div>
    {% endif %}
    {% if show_delete %}
    <form method="post" action="{% url 'gallery_delete' image.pk %}" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-red-700 shadow-lg" onclick="return confirm('Delete this image?');" title="Delete image">
            &times;
        </button>
    </form>
    {% endif %}
</div>
