{% if messages %}
<div class="space-y-4">
    {% for message in messages %}
        <div class="p-4 rounded-md {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-800{% elif message.tags == 'success' %}bg-green-50 border border-green-200 text-green-800{% elif message.tags == 'warning' %}bg-yellow-50 border border-yellow-200 text-yellow-800{% else %}bg-blue-50 border border-blue-200 text-blue-800{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}
