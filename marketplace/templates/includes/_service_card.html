<div class="bg-dark-100 border border-dark-300 rounded-lg p-4 hover:border-gold transition">
    <div class="flex justify-between items-start mb-2">
        <div>
            <h3 class="font-bold text-lg text-text-primary">{{ service.get_service_type_display }}</h3>
            <p class="text-text-muted text-sm">{{ service.duration_minutes }} minutes</p>
        </div>
        <p class="text-2xl font-bold text-emerald-400">${{ service.price }}</p>
    </div>
    {% if service.description %}
    <p class="text-text-secondary text-sm mb-3">{{ service.description }}</p>
    {% endif %}
    <div class="flex gap-2">
        {% block service_actions %}
        <a href="{% url 'service_edit' service.id %}" class="flex-1 text-center btn-gold py-2 rounded text-sm">Edit</a>
        <form method="post" action="{% url 'service_delete' service.id %}" class="flex-1" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white py-2 rounded text-sm w-full transition" onclick="return confirm('Delete this service?');">Delete</button>
        </form>
        {% endblock %}
    </div>
</div>
