<div class="border rounded-lg p-4 hover:shadow-lg transition">
    <div class="flex justify-between items-start mb-2">
        <div>
            <h3 class="font-bold text-lg">{{ service.get_service_type_display }}</h3>
            <p class="text-gray-600 text-sm">{{ service.duration_minutes }} minutes</p>
        </div>
        <p class="text-2xl font-bold text-green-600">${{ service.price }}</p>
    </div>
    {% if service.description %}
    <p class="text-gray-700 text-sm mb-3">{{ service.description }}</p>
    {% endif %}
    <div class="flex gap-2">
        {% block service_actions %}
        <a href="{% url 'service_edit' service.id %}" class="flex-1 text-center text-blue-600 hover:underline">Edit</a>
        <form method="post" action="{% url 'service_delete' service.id %}" class="flex-1" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="text-red-600 hover:underline w-full" onclick="return confirm('Delete this service?');">Delete</button>
        </form>
        {% endblock %}
    </div>
</div>
